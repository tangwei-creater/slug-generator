# /etc/nginx/sites-available/sluggenerator.app
# 使用方法：
#   sudo cp nginx.conf /etc/nginx/sites-available/sluggenerator.app
#   sudo ln -s /etc/nginx/sites-available/sluggenerator.app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name sluggenerator.app www.sluggenerator.app;

    # Cloudflare 模式下，SSL 在 CF 端终止，Nginx 只需要监听 80
    # 如果用 Cloudflare "Full (Strict)" 模式，需要额外配置 443 + CF Origin Certificate

    # www 跳转到裸域（SEO：统一域名）
    if ($host = www.sluggenerator.app) {
        return 301 https://sluggenerator.app$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 静态资源缓存（Next.js _next/static 自带 hash，可长缓存）
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # favicon 等静态文件
    location /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
